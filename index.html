<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FourFourTone</title>
<!-- Nothing in the meta describes today's kits. Link previews must not spoil. -->
<meta name="description" content="A daily colour game for football fans. Seven shirts, seven guesses, one round a day.">
<meta property="og:title" content="FourFourTone">
<meta property="og:description" content="A daily colour game for football fans. Seven shirts, seven guesses, one round a day.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E0E10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,700&display=swap" rel="stylesheet">
<style>  :root{
    --ink:#0E0E10;
    --raise:#17171A;
    --raise2:#1F1F24;
    --line:#43434A;
    --edge:#5E5E66;
    --stage:#76767A;
    --on-stage:#131315;
    --on-stage-2:#FFFFFF;
    --text:#EAEAEC;
    --muted:#8E8E95;
    --quiet:#7C7C83;
    --bad:#C46A6A;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--ink);color:var(--text);
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex;justify-content:center;
    padding:0 var(--s4) env(safe-area-inset-bottom);
  }
  #app{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100%}

  .display{font-weight:700;letter-spacing:-.045em;line-height:.92;font-variation-settings:'wdth' 112}
  /* Condensed numerals. Football's own typography is the number on a shirt back. */
  .numeral{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
           line-height:.85;font-variation-settings:'wdth' 68}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:var(--s4) 2px var(--s3);flex:none;gap:var(--s3)}
  .wordmark{font-size:14px;font-weight:700;letter-spacing:.01em;font-variation-settings:'wdth' 122;
            background:none;color:var(--text);padding:var(--s2) 0;margin:calc(var(--s2) * -1) 0}
  .counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .back{background:none;color:var(--muted);font-size:13px;padding:var(--s2) 0}

  .pips{display:flex;gap:5px;flex:none;margin-bottom:var(--s3)}
  .pip{height:4px;flex:1;border-radius:2px;background:var(--line)}
  .pip.done{background:var(--quiet)}
  .pip.now{background:var(--text)}
  .timerTrack{height:2px;background:var(--line);border-radius:2px;margin-bottom:var(--s3);overflow:hidden;flex:none}
  .timerFill{height:100%;background:var(--text);width:100%;transform-origin:left center}

  /* ---------- stage ---------- */
  .stage{position:relative;background:var(--stage);border-radius:var(--radius);
         padding:var(--s5) var(--s4) var(--s4);flex:none;overflow:hidden;
         display:flex;flex-direction:column;align-items:center}
  /* Achromatic texture only. A tint here would shift how the shirt reads. */
  .stage::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 7px)}
  .ghost{position:absolute;top:-10px;left:0;right:0;text-align:center;font-size:150px;
         font-weight:700;line-height:1;color:rgba(19,19,21,.10);font-variation-settings:'wdth' 68;
         letter-spacing:-.04em;pointer-events:none;user-select:none}
  .shirts{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:var(--s4);width:100%}
  .shirtWrap{position:relative;flex:0 1 auto}
  .shirtWrap svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.22))}
  .solo .shirtWrap{width:200px}
  .duo .shirtWrap{width:142px}
  .shirtLabel{font-size:11px;color:var(--on-stage-2);text-align:center;margin-top:var(--s2);
              font-weight:500;font-variant-numeric:tabular-nums;position:relative}
  .team{position:relative;margin-top:var(--s4);text-align:center;color:var(--on-stage);
        font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variation-settings:'wdth' 116}
  .country{position:relative;margin-top:var(--s2);font-size:12.5px;color:var(--on-stage-2);text-align:center;font-weight:500}

  /* The clip-path goes on the SVG, not on a wrapper div. A wrapper whose only
     child is absolutely positioned has zero height, and inset(0) on a zero-height
     box clips the whole thing away. */
  .flood{position:absolute;inset:0}
  .flood svg{position:absolute;inset:0;width:100%;clip-path:inset(0 0 0 0)}
  .flood.animate svg{animation:flood .55s cubic-bezier(.2,.7,.3,1) both}
  @keyframes flood{from{clip-path:inset(100% 0 0 0)} to{clip-path:inset(0 0 0 0)}}

  /* ---------- picker ---------- */
  .picker{margin-top:var(--s4);flex:none}
  .sv{position:relative;width:100%;height:190px;border-radius:14px;cursor:crosshair;
      touch-action:none;overflow:hidden;border:1px solid var(--edge)}
  .knob{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #fff;
        box-shadow:0 0 0 1px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.45);
        transform:translate(-50%,-50%);pointer-events:none}
  .hue{position:relative;width:100%;height:34px;margin-top:var(--s3);border-radius:10px;
       touch-action:none;cursor:pointer;border:1px solid var(--edge);
       background:linear-gradient(to right,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%)}
  .hueKnob{position:absolute;top:50%;width:18px;height:44px;border-radius:6px;background:#fff;
           box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
  .readout{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4)}
  .swatch{width:58px;height:58px;border-radius:12px;border:1px solid var(--edge);flex:none}
  .readoutText{min-width:0}
  .hex{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;font-family:inherit;
       background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--edge);
       padding:0 0 3px;width:7.5ch;text-transform:uppercase}
  .hex:focus{outline:none;border-bottom-color:var(--text)}
  .hex.bad{border-bottom-color:var(--bad)}
  .numbers{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  .numbers b{font-weight:500;color:var(--text)}

  button{font:inherit;cursor:pointer;border:0}
  .btn{width:100%;min-height:54px;padding:var(--s4);border-radius:14px;background:var(--text);
       color:#0E0E10;font-size:16px;font-weight:700;letter-spacing:-.01em;margin-top:var(--s4);
       transition:transform .08s ease}
  .btn:active{transform:scale(.985)}
  .btn.quiet{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--edge);font-weight:500}
  .btn:disabled{opacity:.45;cursor:default}
  .warn{font-size:13px;color:var(--bad);margin-top:var(--s2);text-align:center}
  :focus-visible{outline:2px solid #fff;outline-offset:3px}

  /* ---------- score ---------- */
  .result{margin-top:var(--s5);flex:none}
  .scoreLine{display:flex;align-items:flex-end;gap:var(--s4)}
  .score{font-size:92px}
  .verdict{font-size:15px;color:var(--muted);padding-bottom:12px;line-height:1.3;max-width:12ch}
  .detail{font-size:13px;color:var(--muted);margin-top:var(--s3);line-height:1.55}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s5)}
  .cell{background:var(--raise);border-radius:14px;padding:var(--s3) var(--s2) var(--s2);
        display:flex;flex-direction:column;align-items:center}
  .cell svg{width:78%;height:auto;display:block;margin-top:var(--s1)}
  .cellName{font-size:11px;font-weight:600;line-height:1.2;text-align:center;
            letter-spacing:-.01em;min-height:2.4em;display:flex;align-items:center}
  .cellMeta{font-size:9.5px;color:var(--muted);text-align:center;margin-top:2px;line-height:1.25}
  .cellScore{font-size:22px;margin-top:var(--s2);padding-bottom:var(--s1)}
  .legend{font-size:12px;color:var(--muted);margin-top:var(--s3);line-height:1.5}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-top:var(--s5)}
  .stat{background:var(--raise);border-radius:14px;padding:var(--s3) var(--s2);text-align:center}
  .statNum{font-size:30px}
  .statLabel{font-size:10.5px;color:var(--muted);margin-top:var(--s1);line-height:1.25}
  .countdown{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
             margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line)}
  .countdownNum{font-size:40px}
  .countdownLabel{font-size:12px;color:var(--muted);text-align:right;max-width:10ch;line-height:1.3}

  /* ---------- home ---------- */
  .hero{position:relative;margin-top:var(--s2);height:180px;display:flex;align-items:flex-end;
        justify-content:center;overflow:hidden;flex:none}
  .hero .h{width:92px;margin:0 -15px}
  .hero .h svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
  .homeTitle{font-size:clamp(38px,11.5vw,54px);margin-top:var(--s5)}
  .homeSub{font-size:15px;color:var(--muted);margin-top:var(--s3);line-height:1.55;max-width:32ch}
  .menu{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s6)}
  .tile{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
        background:var(--raise);border-radius:16px;padding:var(--s4) var(--s5);
        min-height:76px;width:100%;text-align:left;color:var(--text);
        transition:transform .08s ease,background .12s ease}
  .tile:active{transform:scale(.99)}
  .tile:hover{background:var(--raise2)}
  .tileName{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .tileNote{font-size:12.5px;color:var(--muted);margin-top:3px}
  .tileMeta{font-size:26px;flex:none;color:var(--text)}
  .tileMeta.dim{color:var(--quiet);font-size:12.5px;font-weight:500;max-width:7ch;text-align:right;line-height:1.3}

  /* ---------- sections ---------- */
  .h2{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:var(--s2);font-variation-settings:'wdth' 112}
  .lede{font-size:13.5px;color:var(--muted);margin-top:var(--s2);line-height:1.55;max-width:36ch}
  .seg{display:flex;gap:var(--s2);margin-top:var(--s5);background:var(--raise);padding:var(--s1);border-radius:12px}
  .seg button{flex:1;padding:var(--s3);border-radius:9px;background:transparent;color:var(--muted);
              font-size:14px;font-weight:500;min-height:44px}
  .seg button.on{background:var(--text);color:var(--ink);font-weight:700}

  /* ---------- filters ---------- */
  .filterGroup{margin-top:var(--s5)}
  .filterTitle{font-size:11.5px;color:var(--muted);margin-bottom:var(--s3)}
  .chipRow{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .chip{padding:10px var(--s4);border-radius:999px;background:var(--raise);color:var(--text);
        font-size:13.5px;min-height:44px;box-shadow:inset 0 0 0 1px transparent}
  .chip.on{background:var(--text);color:var(--ink);font-weight:700}
  .chip small{color:var(--muted);margin-left:6px;font-size:11.5px}
  .chip.on small{color:rgba(14,14,16,.55)}
  .poolNote{font-size:13px;color:var(--muted);margin-top:var(--s4)}

  /* ---------- leaderboard ---------- */
  .board{margin-top:var(--s4);border-top:1px solid var(--line)}
  .bRow{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 2px;border-bottom:1px solid var(--line)}
  .bRow.you{background:var(--raise);border-radius:10px;padding-left:var(--s3);padding-right:var(--s3)}
  .bRank{font-size:18px;width:2.4ch;flex:none;color:var(--quiet)}
  .bName{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bScore{font-size:19px;flex:none}
  .empty{background:var(--raise);border-radius:16px;padding:var(--s5);margin-top:var(--s4);
         font-size:13.5px;color:var(--muted);line-height:1.6}
  .field{width:100%;background:var(--raise);border:1px solid var(--edge);border-radius:12px;
         padding:var(--s4);font:inherit;font-size:16px;color:var(--text);min-height:54px;margin-top:var(--s3)}
  .field::placeholder{color:var(--quiet)}
  .code{font-variation-settings:'wdth' 68;font-weight:700;font-size:30px;letter-spacing:.12em;
        text-align:center;background:var(--raise);border-radius:14px;padding:var(--s4);margin-top:var(--s3)}

  /* ---------- profile ---------- */
  .pHead{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s4)}
  .pAvatar{width:64px;height:64px;flex:none;border-radius:16px;background:var(--raise);
           display:flex;align-items:center;justify-content:center;font-size:26px}
  .pName{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .pEdit{background:none;color:var(--muted);font-size:12.5px;padding:6px 0;margin-top:2px}
  .bigStat{background:var(--raise);border-radius:16px;padding:var(--s5);margin-top:var(--s4)}
  .bigStatNum{font-size:60px}
  .bigStatLabel{font-size:12.5px;color:var(--muted);margin-top:var(--s2)}
  .streakBar{display:flex;gap:4px;margin-top:var(--s4)}
  .streakSeg{height:34px;flex:1;border-radius:5px;background:var(--line)}
  .streakSeg.on{background:var(--text)}
  /* History uses one hue at varying intensity, never a red-to-green ramp:
     the players most likely to misread that are the ones this game is hardest for. */
  .heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:var(--s4)}
  .day{aspect-ratio:1;border-radius:4px;background:var(--raise2)}
  .scale{display:flex;align-items:center;gap:6px;margin-top:var(--s3);font-size:11px;color:var(--muted)}
  .scale i{width:14px;height:14px;border-radius:3px;display:block}

  .spacer{flex:1;min-height:var(--s4)}
  footer{padding:var(--s4) 2px 26px;font-size:11px;color:var(--quiet);flex:none;line-height:1.5}

  @media (max-width:360px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .score{font-size:76px}
    .heat{grid-template-columns:repeat(10,1fr)}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    .animate .top{animation:none;clip-path:inset(0 0 0 0)}
    .timerTrack{display:none}
  }
</style>
</head>

const BANNED_ANSWERS = ['#000000', '#FFFFFF'];

/* ============================================================
   COLOUR SCIENCE — sRGB → CIELAB → CIEDE2000
   ============================================================ */
function hexToRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHex(r,g,b){
  const t = n => Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0');
  return '#' + t(r) + t(g) + t(b);
}
function hexToLab(hex){
  let [r,g,b] = hexToRgb(hex).map(v => v/255);
  const lin = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  r = lin(r); g = lin(g); b = lin(b);
  let X = (r*0.4124564 + g*0.3575761 + b*0.1804375) / 0.95047;
  let Y = (r*0.2126729 + g*0.7151522 + b*0.0721750) / 1.00000;
  let Z = (r*0.0193339 + g*0.1191920 + b*0.9503041) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787*t + 16/116);
  const fx = f(X), fy = f(Y), fz = f(Z);
  return [116*fy - 16, 500*(fx - fy), 200*(fy - fz)];
}
const rad = d => d * Math.PI / 180;
function hueAngle(b, ap){
  if (b === 0 && ap === 0) return 0;
  const h = Math.atan2(b, ap) * 180 / Math.PI;
  return h < 0 ? h + 360 : h;
}
// kL weights the lightness term. 1 = textbook CIEDE2000. We score with 2:
// the player's screen brightness is unknown, and a correct hue judged on a dim
// phone should not read as a miss.
const SCREEN_LIGHTNESS_TOLERANCE = 2;
function deltaE00(lab1, lab2, kL){
  kL = kL || 1;
  const [L1,a1,b1] = lab1, [L2,a2,b2] = lab2;
  const C1 = Math.hypot(a1,b1), C2 = Math.hypot(a2,b2);
  const Cbar = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cbar,7) / (Math.pow(Cbar,7) + Math.pow(25,7))));
  const a1p = (1+G)*a1, a2p = (1+G)*a2;
  const C1p = Math.hypot(a1p,b1), C2p = Math.hypot(a2p,b2);
  const h1p = hueAngle(b1,a1p), h2p = hueAngle(b2,a2p);
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0){
    dhp = h2p - h1p;
    if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360;
  }
  const dHp = 2 * Math.sqrt(C1p*C2p) * Math.sin(rad(dhp)/2);
  const Lbp = (L1 + L2) / 2, Cbp = (C1p + C2p) / 2;
  let hbp;
  if (C1p * C2p === 0) hbp = h1p + h2p;
  else {
    const d = Math.abs(h1p - h2p);
    if (d <= 180) hbp = (h1p + h2p) / 2;
    else if (h1p + h2p < 360) hbp = (h1p + h2p + 360) / 2;
    else hbp = (h1p + h2p - 360) / 2;
  }
  const T = 1 - 0.17*Math.cos(rad(hbp - 30)) + 0.24*Math.cos(rad(2*hbp))
              + 0.32*Math.cos(rad(3*hbp + 6)) - 0.20*Math.cos(rad(4*hbp - 63));
  const dTheta = 30 * Math.exp(-Math.pow((hbp - 275)/25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cbp,7) / (Math.pow(Cbp,7) + Math.pow(25,7)));
  const Sl = 1 + (0.015 * Math.pow(Lbp - 50, 2)) / Math.sqrt(20 + Math.pow(Lbp - 50, 2));
  const Sc = 1 + 0.045 * Cbp;
  const Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(rad(2*dTheta)) * Rc;
  return Math.sqrt(
    Math.pow(dLp/(kL*Sl), 2) + Math.pow(dCp/Sc, 2) + Math.pow(dHp/Sh, 2) +
    Rt * (dCp/Sc) * (dHp/Sh)
  );
}
// Hard floor. Beyond this distance the guess is simply a different colour,
// and a different colour is worth nothing however fast it arrived.
const ZERO_AT_DELTA_E = 30;
function scoreFor(dE){
  if (dE >= ZERO_AT_DELTA_E) return 0;
  return Math.round(100 * Math.pow(1 - dE / ZERO_AT_DELTA_E, 1.6));
}
function verdictFor(s){
  if (s >= 90) return "Spot on";
  if (s >= 70) return "Very close";
  if (s >= 45) return "In the right area";
  if (s >= 20) return "Some way off";
  if (s > 0)   return "Barely on the board";
  return "Not the same colour";
}

/* ============================================================
   HSV / HSL / HEX
   ============================================================ */
function hsvToHex(h,s,v){
  const c = v*s, x = c*(1 - Math.abs(((h/60) % 2) - 1)), m = v - c;
  let r=0,g=0,b=0;
  if (h < 60)       {r=c; g=x;}
  else if (h < 120) {r=x; g=c;}
  else if (h < 180) {g=c; b=x;}
  else if (h < 240) {g=x; b=c;}
  else if (h < 300) {r=x; b=c;}
  else              {r=c; b=x;}
  return rgbToHex((r+m)*255, (g+m)*255, (b+m)*255);
}
function hexToHsv(hex){
  const [r,g,b] = hexToRgb(hex).map(v => v/255);
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  let h = 0;
  if (d){
    if (max === r)      h = 60 * ((((g-b)/d) % 6 + 6) % 6);
    else if (max === g) h = 60 * ((b-r)/d + 2);
    else                h = 60 * ((r-g)/d + 4);
  }
  return {h, s: max ? d/max : 0, v: max};
}
// HSL reads better to a player than HSV: L is simply "how light".
function hsvToHsl(h,s,v){
  const l = v * (1 - s/2);
  return {h, s: (l === 0 || l === 1) ? 0 : (v - l) / Math.min(l, 1 - l), l};
}
function hslToHsv(h,s,l){
  const v = l + s * Math.min(l, 1 - l);
  return {h, s: v ? 2 * (1 - l/v) : 0, v};
}

/* ============================================================
   SHIRT RENDERER — flat fills only. Shading would distort the
   colour the player is being asked to judge.
   ============================================================ */
const SHIRT_PATH = "M62,20 L86,10 C92,26 108,26 114,10 L138,20 L190,50 L168,88 L150,76 L150,210 L50,210 L50,76 L32,88 L10,50 Z";
function overlayShapes(pattern){
  let out = '';
  if (pattern === 'stripes'){
    for (let x = 0; x < 200; x += 24) out += `<rect x="${x}" y="0" width="12" height="220"/>`;
  } else if (pattern === 'hoops'){
    for (let y = 0; y < 220; y += 30) out += `<rect x="0" y="${y}" width="200" height="15"/>`;
  } else if (pattern === 'halves'){
    out += `<rect x="100" y="0" width="100" height="220"/>`;
  } else if (pattern === 'band'){
    out += `<rect x="82" y="0" width="36" height="220"/>`;
  } else if (pattern === 'chest'){
    out += `<rect x="0" y="88" width="200" height="34"/>`;
  } else if (pattern === 'sash'){
    out += `<polygon points="140,0 200,0 60,220 0,220"/>`;
  } else if (pattern === 'checks'){
    for (let i = 0; i < 8; i++) for (let j = 0; j < 9; j++){
      if ((i + j) % 2 === 0) out += `<rect x="${i*25}" y="${j*25}" width="25" height="25"/>`;
    }
  }
  return out;
}
let uidCounter = 0;
function shirtSVG(kit, mode, fill, label){
  const uid = 'k' + (uidCounter++);
  const mainFill = mode === 'guess' ? `url(#hatch${uid})` : fill;
  const baseFill = kit.role === 'base' ? mainFill : kit.sec;
  const overFill = kit.role === 'base' ? kit.sec  : mainFill;
  return `
<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label || (kit.team + ' shirt')}">
  <defs>
    <clipPath id="clip${uid}"><path d="${SHIRT_PATH}"/></clipPath>
    <pattern id="hatch${uid}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#CFCFD2"/><rect width="4.5" height="9" fill="#B4B4B8"/>
    </pattern>
  </defs>
  <g clip-path="url(#clip${uid})">
    <rect x="0" y="0" width="200" height="220" fill="${baseFill}"/>
    <g fill="${overFill}">${kit.pattern === 'plain' ? '' : overlayShapes(kit.pattern)}</g>
  </g>
  <path d="${SHIRT_PATH}" fill="none" stroke="#151517" stroke-width="4" stroke-linejoin="round"/>
</svg>`;
}


/* ============================================================
   CONFIG
   ============================================================ */
const EPOCH = Date.UTC(2026, 0, 1);
const HOME_PER_ROUND = 4;
const AWAY_PER_ROUND = 3;
const ROUND_LENGTH = HOME_PER_ROUND + AWAY_PER_ROUND;
const SECONDS_PER_KIT = 25;
const MAX_TIME_BONUS = 25;
// Speed is only worth rewarding once the guess is actually in the right area.
// A fast wrong answer is still a wrong answer.
const BONUS_MIN_ACCURACY = 60;

const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function utcDayMs(d){
  d = d || new Date();
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
const isoDay = ms => new Date(ms).toISOString().slice(0,10);
const puzzleNo = ms => Math.floor((ms - EPOCH) / 86400000) + 1;

function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd){
  rnd = rnd || Math.random;
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
// One club per round. Two Liverpool aways in the same seven is a worse round
// than any home/away split is a better one, so the club rule wins where they
// conflict. Aways are picked first because they are far scarcer than home kits:
// let a home kit go first and it takes the only slot that club could have used.
function buildRound(pool, rnd){
  const clubs = new Set(), tones = new Set(), out = [];
  // strict = one club AND one exact colour value per round. The colour rule is
  // what lets the same red sit on twenty seasons of Arsenal in the database
  // without two of them ever turning up in the same seven.
  const take = (list, target, strict) => {
    for (const k of shuffle(list, rnd)){
      if (out.length >= target) return;
      if (clubs.has(k.team)) continue;
      if (strict && tones.has(k.main.toUpperCase())) continue;
      clubs.add(k.team); tones.add(k.main.toUpperCase()); out.push(k);
    }
  };
  take(pool.filter(k => k.type !== 'Home'), AWAY_PER_ROUND, true);
  take(pool.filter(k => k.type === 'Home'), ROUND_LENGTH, true);
  take(pool, ROUND_LENGTH, true);
  take(pool, ROUND_LENGTH, false);   // last resort: keep the club rule, drop the colour rule
  return shuffle(out, rnd);
}
const dailyRound = dayMs => buildRound(KITS, mulberry32(hashStr('fourfourtone:' + isoDay(dayMs))));

function fmtTime(ms){
  const s = Math.round(ms / 1000);
  return s < 60 ? s + 's' : Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0');
}

/* ============================================================
   LEADERBOARDS
   Everything the leaderboards need goes through Boards. This
   implementation keeps scores on this device, which means you are
   the only player in it. To go live, replace these five functions
   with fetch() calls to your API and change nothing else.
   ============================================================ */
const BOARD_KEY = 'fourfourtone.boards.v1';
const Boards = {
  _read(){
    try { return JSON.parse(localStorage.getItem(BOARD_KEY)) || {global:{}, custom:{}}; }
    catch(e){ return {global:{}, custom:{}}; }
  },
  _write(d){ try { localStorage.setItem(BOARD_KEY, JSON.stringify(d)); } catch(e){} },
  newCode(){
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no I/O/0/1
    return Array.from({length:6}, () => abc[Math.floor(Math.random()*abc.length)]).join('');
  },
  async entries(code, puzzle){
    const d = this._read();
    const src = code ? (d.custom[code] && d.custom[code].scores) : d.global;
    const list = (src && src[puzzle]) || [];
    return list.slice().sort((a,b) => b.score - a.score || a.ms - b.ms);
  },
  async submit(code, puzzle, entry){
    const d = this._read();
    let bucket;
    if (code){
      if (!d.custom[code]) return false;
      d.custom[code].scores = d.custom[code].scores || {};
      bucket = d.custom[code].scores;
    } else bucket = d.global;
    bucket[puzzle] = (bucket[puzzle] || []).filter(e => e.name !== entry.name).concat(entry);
    this._write(d);
    return true;
  },
  async create(name){
    const d = this._read();
    const code = this.newCode();
    d.custom[code] = {name, scores:{}};
    this._write(d);
    return {code, name};
  },
  async join(code){
    const d = this._read();
    return d.custom[code] ? {code, name: d.custom[code].name} : null;
  }
};

/* ============================================================
   STATE + ROUTING
   ============================================================ */
const app = document.getElementById('app');

const todayISO = isoDay(today);

let state = {
  screen:'home', mode:'daily', round:[], index:0, results:[], roundStart:0,
  filters:new Set(), boardTab:'global', activeBoard:null, notice:'',
  h:0, s:0, v:0.5, touched:false, armed:false,
  timeLeft:SECONDS_PER_KIT, ticker:null, clock:null
};

const currentHex = () => hsvToHex(state.h, state.s, state.v);
const currentKit = () => state.round[state.index];
const maxScore = () => ROUND_LENGTH * (100 + MAX_TIME_BONUS);
const dailyDone = () => !!(store.today && store.today.date === todayISO);

function go(screen){ state.screen = screen; state.notice = ''; render(); }

/* ---------------- filters ---------------- */
// One dimension: which nation's league the kit comes from. National-team kits
// are not a nation's league, so they get their own bucket rather than doubling
// up (Uruguay the league and Uruguay the country were two chips for one idea).
const nationOf = k => k.country === 'National' ? 'International' : k.country;
// "1997/98" and "1986" both yield the decade from their leading year.
const decadeOf = k => (Math.floor(parseInt(k.season.slice(0,4), 10) / 10) * 10) + 's';
function nationKeys(){
  const c = {};
  KITS.forEach(k => { const n = nationOf(k); c[n] = (c[n]||0)+1; });
  return Object.keys(c)
    .map(n => ({key:'N:'+n, label:n, n:c[n]}))
    .sort((a,b) => b.n - a.n || a.label.localeCompare(b.label));   // busiest first
}
function eraKeys(){
  const c = {};
  KITS.forEach(k => { const e = decadeOf(k); c[e] = (c[e]||0)+1; });
  // Chronological, not by volume: a run of decades has an order people expect.
  return Object.keys(c).sort().map(e => ({key:'E:'+e, label:e, n:c[e]}));
}
// Within a group the filters are OR. Across groups they are AND, so picking
// England and the 1990s means English kits from the nineties, not both sets.
function filteredPool(){
  let anyNation = false, anyEra = false;
  state.filters.forEach(f => { if (f[0] === 'N') anyNation = true; else anyEra = true; });
  if (!anyNation && !anyEra) return KITS;
  return KITS.filter(k =>
    (!anyNation || state.filters.has('N:' + nationOf(k))) &&
    (!anyEra    || state.filters.has('E:' + decadeOf(k))));
}
// The home/away split is a preference, not a requirement. Some decades have no
// away kits at all, and a 24-kit decade is perfectly playable without one.
// Distinct CLUBS is the real requirement, since a round holds seven of them.
function poolViable(pool){
  return new Set(pool.map(k => k.team)).size >= ROUND_LENGTH &&
         new Set(pool.map(k => k.main.toUpperCase())).size >= ROUND_LENGTH;
}

/* ---------------- round lifecycle ---------------- */
function startDaily(){
  state.mode = 'daily';
  state.round = dailyRound(today);
  beginRound();
}
function startFree(){
  const pool = filteredPool();
  if (!poolViable(pool)) return;
  state.mode = 'free';
  state.round = buildRound(pool);
  beginRound();
}
function beginRound(){
  state.index = 0; state.results = []; state.roundStart = Date.now();
  startKit();
}
function startKit(){
  // Everyone starts from the same neutral grey. A random seed hands one player
  // a head start and scores another on a colour they never chose.
  state.h = 0; state.s = 0; state.v = 0.5;
  state.touched = false; state.armed = false;
  state.timeLeft = SECONDS_PER_KIT;
  state.screen = 'playing';
  render();
  startTimer();
}
function startTimer(){
  stopTimer();
  const began = Date.now();
  state.ticker = setInterval(() => {
    state.timeLeft = Math.max(0, SECONDS_PER_KIT - (Date.now() - began)/1000);
    const fill = document.querySelector('.timerFill');
    if (fill) fill.style.transform = `scaleX(${state.timeLeft / SECONDS_PER_KIT})`;
    const secs = document.getElementById('secs');
    if (secs) secs.textContent = Math.ceil(state.timeLeft) + 's';
    if (state.timeLeft <= 0) lockIn(false);
  }, 100);
}
function stopTimer(){ if (state.ticker) clearInterval(state.ticker); state.ticker = null; }

function lockIn(committed){
  // Tapping lock without touching the picker is almost always a misfire,
  // so the first tap arms it and says so rather than scoring neutral grey.
  if (committed === true && !state.touched && !state.armed){
    state.armed = true;
    const w = document.getElementById('warn');
    if (w) w.textContent = 'You have not moved the picker. Tap again to lock in grey.';
    return;
  }
  stopTimer();
  const kit = currentKit();
  if (committed !== true && !state.touched){
    state.results.push({kit, guess:null, dE:null, accuracy:0, bonus:0, total:0});
  } else {
    const guess = currentHex();
    const dE = deltaE00(hexToLab(guess), hexToLab(kit.main), SCREEN_LIGHTNESS_TOLERANCE);
    const accuracy = scoreFor(dE);
    const bonus = accuracy >= BONUS_MIN_ACCURACY
      ? Math.round((state.timeLeft / SECONDS_PER_KIT) * MAX_TIME_BONUS) : 0;
    state.results.push({kit, guess, dE, accuracy, bonus, total: accuracy + bonus});
  }
  state.screen = 'revealed';
  render();
}
function next(){
  if (state.index + 1 >= state.round.length) finishRound();
  else { state.index++; startKit(); }
}
function finishRound(){
  const total = state.results.reduce((a,r) => a + r.total, 0);
  const ms = Date.now() - state.roundStart;
  if (state.mode === 'daily'){
    const yesterday = isoDay(today - 86400000);
    store.streak = store.lastPlayed === yesterday ? store.streak + 1 : 1;
    store.maxStreak = Math.max(store.maxStreak, store.streak);
    store.lastPlayed = todayISO;
    store.played += 1;
    store.totalScore += total;
    store.history[todayISO] = total;
    if (!store.best || total > store.best.score) store.best = {score:total, ms, date:todayISO};
    store.today = {date:todayISO, total, ms, published:false,
                   results: state.results.map(r => ({kit:r.kit, guess:r.guess, dE:r.dE,
                     accuracy:r.accuracy, bonus:r.bonus, total:r.total}))};
    saveStore();
  } else {
    state.freeMs = ms;
  }
  state.screen = 'done';
  render();
}

      <button class="btn" id="lock">Lock it in</button>
      <p class="warn" id="warn"></p>
    </div>
    <div class="spacer"></div>`;
  wireField(); wireHexInput(); paintPicker();
  document.getElementById('lock').onclick = () => lockIn(true);
}

/* ---------------- reveal ---------------- */
function renderRevealed(){
  const r = state.results[state.results.length - 1];
  const last = state.index + 1 >= state.round.length;
  const mystery = r.guess
    ? `<div class="shirtWrap"><div style="position:relative">
         ${shirtSVG(r.kit,'guess',null,'The shirt before the reveal')}
         <div class="flood ${reduceMotion ? '' : 'animate'}">
           ${shirtSVG(r.kit,'colour',r.kit.main,'The real shirt')}
         </div></div>
         <div class="shirtLabel">${r.kit.main.toUpperCase()}</div></div>`
    : `<div class="shirtWrap">${shirtSVG(r.kit,'colour',r.kit.main,'The real shirt')}
         <div class="shirtLabel">${r.kit.main.toUpperCase()}</div></div>`;
  const yours = r.guess ? `<div class="shirtWrap">${shirtSVG(r.kit,'colour',r.guess,'Your guess')}
         <div class="shirtLabel">${r.guess.toUpperCase()}</div></div>` : '';
  app.innerHTML = `
    ${bar(`${state.index + 1} / ${state.round.length}`)}
    ${pips()}
    <div class="stage">
      ${seasonGhost(r.kit)}
      <div class="shirts ${r.guess ? 'duo' : 'solo'}">${mystery}${yours}</div>
      ${stageHead(r.kit)}
    </div>
    <div class="result">
      <div class="scoreLine" role="status">
        <div class="score numeral" id="bigScore">${reduceMotion ? r.total : 0}</div>
        <div class="verdict">${r.guess ? verdictFor(r.accuracy) : 'Ran out of time'}</div>
      </div>
      <div class="detail">${r.guess
        ? `${r.accuracy} for accuracy${r.bonus ? ` and ${r.bonus} for the clock`
           : (r.accuracy > 0 ? '. Too far out for a speed bonus' : '')}. Colour distance &Delta;E ${r.dE.toFixed(1)}.`
        : 'You did not move the picker, so nothing was locked in.'}</div>
      <button class="btn" id="next">${last ? 'See your round' : 'Next shirt'}</button>
    </div>
    <div class="spacer"></div>`;
  document.getElementById('next').onclick = next;
  if (!reduceMotion) countUp(document.getElementById('bigScore'), r.total, 650);
}
// Motion that reports a state change, not decoration.
function countUp(el, to, ms){
  if (!el) return;
  const raf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : null;
  if (!to || !raf){ el.textContent = to || 0; return; }
  const began = performance.now();
  const step = now => {
    const p = Math.min(1, (now - began) / ms);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) raf(step);
  };
  raf(step);
}

/* ---------------- results ---------------- */
// One silhouette per shirt, split down the middle: your colour against the real
// one. Seven of those side by side is the thing worth screenshotting.
function splitShirtSVG(guess, actual){
  const uid = 's' + (uidCounter++);
  return `
<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><clipPath id="sc${uid}"><path d="${SHIRT_PATH}"/></clipPath></defs>
  <g clip-path="url(#sc${uid})">
    <rect x="0" y="0" width="100" height="220" fill="${guess || '#2A2A2E'}"/>
    <rect x="100" y="0" width="100" height="220" fill="${actual}"/>
  </g>
  <path d="M100,10 L100,210" stroke="rgba(0,0,0,.35)" stroke-width="2"/>
  <path d="${SHIRT_PATH}" fill="none" stroke="#0E0E10" stroke-width="5" stroke-linejoin="round"/>
</svg>`;
}
function renderDone(){
  const daily = state.mode === 'daily';
  const results = state.results;
  const total = results.reduce((a,r) => a + r.total, 0);
  const avg = store.played ? Math.round(store.totalScore / store.played) : 0;
  const cells = results.map(r => `<div class="cell">
      <div class="cellName">${r.kit.team}</div>
      <div class="cellMeta">${r.kit.season} ${r.kit.type}</div>
      ${splitShirtSVG(r.guess, r.kit.main)}
      <div class="cellScore numeral">${r.total}</div></div>`).join('');
  const published = daily && store.today && store.today.published;
  app.innerHTML = `
    ${bar('', daily ? 'home' : 'freeplay')}
    <div class="result" style="margin-top:var(--s2)">
      <div class="scoreLine" role="status">
        <div class="score numeral" id="bigScore">${reduceMotion ? total : 0}</div>
        <div class="verdict">out of ${maxScore()}${daily ? '' : ', freeplay'}</div>
      </div>
      <div class="grid">${cells}</div>
      <p class="legend">Left half is the colour you picked. Right half is the shirt.</p>
      ${daily ? `
      <div class="stats">
        <div class="stat"><div class="statNum numeral">${store.streak}</div><div class="statLabel">day streak</div></div>
        <div class="stat"><div class="statNum numeral">${store.maxStreak}</div><div class="statLabel">best streak</div></div>
        <div class="stat"><div class="statNum numeral">${store.played}</div><div class="statLabel">rounds</div></div>
        <div class="stat"><div class="statNum numeral">${avg}</div><div class="statLabel">average</div></div>
      </div>
      ${published ? '<p class="poolNote">Published to the leaderboard.</p>' : `
        <input class="field" id="pubName" maxlength="18" placeholder="Name for the leaderboard"
               value="${store.name || ''}" aria-label="Your leaderboard name">
        <button class="btn quiet" id="publish">Publish to leaderboard</button>`}
      <div class="countdown">
        <div class="countdownNum numeral" id="cd" role="timer" aria-live="off">--:--:--</div>
        <div class="countdownLabel">until the next round</div>
      </div>
      <button class="btn" id="share">Copy your result</button>
      <button class="btn quiet" data-go="freeplay">Freeplay</button>`
    : `<button class="btn" id="again">Another freeplay round</button>
       <button class="btn quiet" data-go="freeplay">Change filters</button>`}
      ${state.notice ? `<p class="poolNote">${state.notice}</p>` : ''}
    </div>
    <div class="spacer"></div>`;
  if (daily){
    startClock();
    document.getElementById('share').onclick = shareResult;
    const p = document.getElementById('publish');
    if (p) p.onclick = publishToday;
  } else {
    document.getElementById('again').onclick = startFree;
  }
  if (!reduceMotion) countUp(document.getElementById('bigScore'), total, 800);
}
async function publishToday(){
  const name = (document.getElementById('pubName').value || '').trim();
  if (name.length < 2){ state.notice = 'Pick a name of at least two characters.'; return render(); }
  store.name = name;
  await Boards.submit(null, puzzleNo(today), {name, score:store.today.total, ms:store.today.ms});
  for (const b of store.boards) await Boards.submit(b.code, puzzleNo(today), {name, score:store.today.total, ms:store.today.ms});
  store.today.published = true;
  saveStore();
  state.notice = 'Published. Your score is on the global board and any private boards you have joined.';
  render();
}

/* ---------------- leaderboards ---------------- */
async function renderBoards(){
  const puzzle = puzzleNo(today);
  const isGlobal = state.boardTab === 'global';
  const code = isGlobal ? null : state.activeBoard;
  const rows = await Boards.entries(code, puzzle);
  const list = rows.length ? `<div class="board">${rows.map((e,i) => `
      <div class="bRow ${e.name === store.name ? 'you' : ''}">
        <div class="bRank numeral">${i+1}</div>
        <div class="bName">${e.name}</div>
        <div class="bScore numeral">${e.score}</div>
      </div>`).join('')}</div>`
    : `<div class="empty">No scores yet for No. ${puzzle}.
        ${dailyDone() ? 'Publish yours from the results screen.' : 'Play today\u2019s round first.'}
        <br><br>This build keeps scores on your device, so nobody else appears here until a server is connected.</div>`;
  const boards = store.boards.map(b =>
    `<button class="chip ${state.activeBoard === b.code ? 'on' : ''}" data-b="${b.code}">${b.name}<small>${b.code}</small></button>`).join('');
  app.innerHTML = `
    ${bar('', 'home')}
    <h1 class="h2">Leaderboards</h1>
    <div class="seg">
      <button class="${isGlobal ? 'on' : ''}" data-tab="global">Global</button>
      <button class="${isGlobal ? '' : 'on'}" data-tab="custom">Private</button>
    </div>
    ${isGlobal ? `<p class="lede">Everyone who published a score for today's round.</p>${list}` : `
      <div class="chipRow" style="margin-top:var(--s4)">${boards ||
        '<p class="lede">You have not joined a board yet.</p>'}</div>
      ${state.activeBoard ? list : ''}
      <input class="field" id="joinCode" maxlength="6" placeholder="Enter a six-character code"
             style="text-transform:uppercase" aria-label="Board code">
      <button class="btn quiet" id="joinBtn">Join a board</button>
      <button class="btn quiet" id="createBtn">Create a board</button>`}
    ${state.notice ? `<p class="poolNote">${state.notice}</p>` : ''}
    <div class="spacer"></div>`;
  wireBar();
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    state.boardTab = b.dataset.tab; state.notice = ''; render();
  });
  app.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    state.activeBoard = b.dataset.b; render();
  });
  const j = document.getElementById('joinBtn');
  if (j) j.onclick = async () => {
    const code = (document.getElementById('joinCode').value || '').trim().toUpperCase();
    const found = await Boards.join(code);
    if (!found){ state.notice = 'No board with that code.'; return render(); }
    if (!store.boards.some(b => b.code === code)) store.boards.push(found);
    saveStore(); state.activeBoard = code; state.notice = 'Joined ' + found.name + '.'; render();
  };
  const c = document.getElementById('createBtn');
  if (c) c.onclick = async () => {
    const b = await Boards.create((store.name || 'My') + "'s board");
    store.boards.push(b); saveStore();
    state.activeBoard = b.code;
    state.notice = 'Board created. Share the code ' + b.code + ' with your friends.';
    render();
  };
}

/* ---------------- profile ---------------- */
function renderProfile(){
  const avg = store.played ? Math.round(store.totalScore / store.played) : 0;
  const initial = (store.name || '?').trim().charAt(0).toUpperCase();
  // Last 7 days as a streak bar, last 70 as an intensity grid.
  const seg = Array.from({length:7}, (_,i) => {
    const d = isoDay(today - (6-i)*86400000);
    return `<div class="streakSeg ${store.history[d] != null ? 'on' : ''}" title="${d}"></div>`;
  }).join('');
  const days = Array.from({length:70}, (_,i) => {
    const d = isoDay(today - (69-i)*86400000);
    const v = store.history[d];
    const a = v == null ? 0 : 0.15 + 0.85 * Math.min(1, v / maxScore());
    return `<div class="day" style="${v == null ? '' : `background:rgba(234,234,236,${a.toFixed(2)})`}"
                 title="${d}${v == null ? '' : ': ' + v}"></div>`;
  }).join('');
  app.innerHTML = `
    ${bar('', 'home')}
    <div class="pHead">
      <div class="pAvatar numeral">${initial}</div>
      <div>
        <div class="pName" id="pName">${store.name || 'No name yet'}</div>
        <button class="pEdit" id="editName">Edit name</button>
      </div>
    </div>
    <div id="nameEdit" hidden>
      <input class="field" id="nameInput" maxlength="18" value="${store.name || ''}"
             placeholder="Your name" aria-label="Your name">
      <button class="btn quiet" id="saveName">Save</button>
    </div>
    <div class="bigStat">
      <div class="bigStatNum numeral">${store.best ? store.best.score : 0}</div>
      <div class="bigStatLabel">Best round${store.best ? ` \u00B7 ${fmtTime(store.best.ms)} \u00B7 ${store.best.date}` : ''}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="statNum numeral">${store.streak}</div><div class="statLabel">streak</div></div>
      <div class="stat"><div class="statNum numeral">${store.maxStreak}</div><div class="statLabel">best streak</div></div>
      <div class="stat"><div class="statNum numeral">${store.played}</div><div class="statLabel">rounds</div></div>
      <div class="stat"><div class="statNum numeral">${avg}</div><div class="statLabel">average</div></div>
    </div>
    <div class="filterGroup">
      <div class="filterTitle">This week</div>
      <div class="streakBar">${seg}</div>
    </div>
    <div class="filterGroup">
      <div class="filterTitle">Last ten weeks</div>
      <div class="heat">${days}</div>
      <div class="scale"><span>Lower</span>
        <i style="background:rgba(234,234,236,.2)"></i><i style="background:rgba(234,234,236,.45)"></i>
        <i style="background:rgba(234,234,236,.7)"></i><i style="background:rgba(234,234,236,1)"></i>
        <span>Higher</span></div>
    </div>
    <div class="spacer"></div>
    <footer>Stats live on this device only until you connect an account.</footer>`;
  document.getElementById('editName').onclick = () => {
    document.getElementById('nameEdit').hidden = false;
    document.getElementById('nameInput').focus();
  };
  document.getElementById('saveName').onclick = () => {
    store.name = (document.getElementById('nameInput').value || '').trim();
    saveStore(); render();
  };
}

/* ---------------- countdown + share ---------------- */
function startClock(){
  const tick = () => {
    const el = document.getElementById('cd');
    if (!el) return stopClock();
    const s = Math.max(0, Math.floor((today + 86400000 - Date.now()) / 1000));
    el.textContent = `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  };
  tick(); state.clock = setInterval(tick, 1000);
}
function stopClock(){ if (state.clock) clearInterval(state.clock); state.clock = null; }

// Density blocks, not coloured squares: the score must not be encoded in hue
// on a game played by people who may not see hue. Nothing here names a kit.
const band = a => a >= 90 ? '\u2588' : a >= 70 ? '\u2593' : a >= 45 ? '\u2592' : a >= 20 ? '\u2591' : '\u00B7';
function shareResult(){
  const total = state.results.reduce((a,r) => a + r.total, 0);
  const text = `FourFourTone No. ${puzzleNo(today)}\n${total}/${maxScore()}\n`
             + state.results.map(r => band(r.accuracy)).join('')
             + (store.streak > 1 ? `\n${store.streak} day streak` : '');
  const btn = document.getElementById('share');
  const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy your result', 1600); };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}

/* ============================================================
   PICKER
   ============================================================ */
function paintPicker(){
  const hex = currentHex();
  const hsl = hsvToHsl(state.h, state.s, state.v);
  const sv = document.getElementById('sv');
  if (sv){
    sv.style.background = `linear-gradient(to top, #000, rgba(0,0,0,0)), `
                        + `linear-gradient(to right, #fff, ${hsvToHex(state.h,1,1)})`;
    const knob = document.getElementById('knob');
    knob.style.left = (state.s * 100) + '%';
    knob.style.top = ((1 - state.v) * 100) + '%';
    knob.style.background = hex;
    document.getElementById('hueKnob').style.left = ((state.h / 360) * 100) + '%';
    const hue = document.getElementById('hue');
    hue.setAttribute('aria-valuenow', Math.round(state.h));
    hue.setAttribute('aria-valuetext', Math.round(state.h) + ' degrees');
  }
  // The guess shown at shirt scale, not just as a chip. Judging a large area
  // is far more accurate than judging a swatch.
  const live = document.getElementById('liveShirt');
  if (live) live.firstElementChild.outerHTML =
    shirtSVG(currentKit(), 'colour', hex, 'Your guess on the same shirt');
  document.getElementById('swatch').style.background = hex;
  const input = document.getElementById('hexInput');
  if (document.activeElement !== input){ input.value = hex.toUpperCase(); input.classList.remove('bad'); }
  document.getElementById('numbers').innerHTML =
    'hue <b>' + Math.round(hsl.h) + '\u00B0</b>  saturation <b>' + Math.round(hsl.s*100) +
    '%</b>  lightness <b>' + Math.round(hsl.l*100) + '%</b>';
}
const clamp01 = n => Math.max(0, Math.min(1, n));
function wireField(){
  const sv = document.getElementById('sv'), hue = document.getElementById('hue');
  const svMove = e => {
    const r = sv.getBoundingClientRect();
    state.s = clamp01((e.clientX - r.left) / r.width);
    state.v = clamp01(1 - (e.clientY - r.top) / r.height);
    state.touched = true; paintPicker();
  };
  const hueMove = e => {
    const r = hue.getBoundingClientRect();
    state.h = clamp01((e.clientX - r.left) / r.width) * 359.9;
    state.touched = true; paintPicker();
  };
  const drag = (el, move) => el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId); move(e);
    const onMove = ev => move(ev);
    const onUp = () => {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onUp);
    };
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
  });
  drag(sv, svMove); drag(hue, hueMove);
  sv.addEventListener('keydown', e => {
    const step = e.shiftKey ? 0.1 : 0.02;
    if (e.key === 'ArrowRight') state.s = clamp01(state.s + step);
    else if (e.key === 'ArrowLeft') state.s = clamp01(state.s - step);
    else if (e.key === 'ArrowUp') state.v = clamp01(state.v + step);
    else if (e.key === 'ArrowDown') state.v = clamp01(state.v - step);
    else return;
    e.preventDefault(); state.touched = true; paintPicker();
  });
  hue.addEventListener('keydown', e => {
    const step = e.shiftKey ? 15 : 3;
    if (e.key === 'ArrowRight') state.h = (state.h + step) % 360;
    else if (e.key === 'ArrowLeft') state.h = (state.h - step + 360) % 360;
    else return;
    e.preventDefault(); state.touched = true; paintPicker();
  });
}
function wireHexInput(){
  const input = document.getElementById('hexInput');
  input.addEventListener('input', () => {
    const v = input.value.trim().replace(/^#/, '');
    if (!/^[0-9A-Fa-f]{6}$/.test(v)){ input.classList.add('bad'); return; }
    input.classList.remove('bad');
    const hsv = hexToHsv('#' + v);
    state.h = hsv.h; state.s = hsv.s; state.v = hsv.v;
    state.touched = true; paintPicker();
  });
  input.addEventListener('blur', paintPicker);
}

render();

</script>
